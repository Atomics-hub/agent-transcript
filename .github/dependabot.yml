version: 2
updates:
  - package-ecosystem: npm
    directory: /
    ignore:
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
    schedule:
      interval: weekly
    groups:
      development-dependencies:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
